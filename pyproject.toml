[project]
name = "yt-bot"
version = "0.1.0"
description = "Telegram bot that summarizes YouTube videos into Twi voice notes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0",
    "google-genai>=1.73.1",
    "python-dotenv>=1.2.1",
    "psycopg[binary]>=3.2.0",
    "requests>=2.33.1",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.44.0",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-mock>=3.14.0"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]
