name: Deploy to Cloud Run

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy yt-bot \
            --source . \
            --region "${{ secrets.GCP_REGION }}" \
            --allow-unauthenticated \
            --cpu=2 \
            --memory=1Gi \
            --concurrency=1 \
            --cpu-boost \
            --add-cloudsql-instances "${{ secrets.GCP_CLOUDSQL_INSTANCE }}" \
            --service-account "yt-bot-runner@yt-asr.iam.gserviceaccount.com" \
            --set-env-vars "APP_ENV=production,AUTO_INIT_DB=true,GCP_PROJECT_ID=yt-asr,GCP_REGION=${{ secrets.GCP_REGION }},TTS_TEMPO=1.0,PIPELINE_WORKERS=4" \
            --set-secrets "TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest,TELEGRAM_SECRET_TOKEN=TELEGRAM_SECRET_TOKEN:latest,KHAYA_API_KEY=KHAYA_API_KEY:latest,DATABASE_URL=DATABASE_URL:latest" \
            --quiet
